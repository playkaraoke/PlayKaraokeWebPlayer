# Cloudflare Worker da busca Online do Play Karaoke.
# Deploy: ver worker/README.md
name = "playkaraoke-search"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Cache das buscas (24h) e contador de uso das chaves (rodízio).
# O id é gerado pelo comando
#   npx wrangler kv namespace create SEARCH_CACHE
# e colado aqui.
[[kv_namespaces]]
binding = "SEARCH_CACHE"
id = "b02679627cc84307bac90ce56d8066fe"

# As chaves da API do YouTube NÃO ficam neste arquivo (ele é público).
# Elas são guardadas como secrets com:
#   npx wrangler secret put YOUTUBE_API_KEY
#   npx wrangler secret put YOUTUBE_API_KEY_2
#   npx wrangler secret put YOUTUBE_API_KEY_3
#
# Para adicionar uma 4ª chave no futuro:
#   1. npx wrangler secret put YOUTUBE_API_KEY_4
#   2. Adicione 'YOUTUBE_API_KEY_4' no array KEY_NAMES, em src/index.js
#   3. npx wrangler deploy