<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Play Karaoke — Segunda Tela</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#000;overflow:hidden;}
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter',sans-serif;
  }
  #canvas-wrap, #video-wrap{
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  #cdg-canvas{
    max-width:min(100vw, calc(100vh * 300 / 216));
    max-height:min(100vh, calc(100vw * 216 / 300));
    width:100%;
    aspect-ratio:300/216;
    background:#000;
  }
  #video-el{
    max-width:100vw;
    max-height:100vh;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
  }
  .hidden{display:none !important;}

  #idle-overlay{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #idle-logo{
    width:22vw;
    max-width:280px;
    opacity:0.5;
  }
  #idle-custom-image{
    position:fixed;
    inset:0;
    background-size:cover;
    background-position:center;
  }

  #fs-btn{
    position:fixed;
    bottom:16px;
    right:16px;
    width:42px;height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(20,20,20,0.6);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:8px;
    color:#e5e2e1;
    cursor:pointer;
    opacity:0;
    transition:opacity 0.15s ease;
    z-index:10;
  }
  body:hover #fs-btn{ opacity:1; }
  #fs-btn:hover{ background:rgba(40,40,40,0.8); }
  #fs-btn svg{ width:20px;height:20px; }

  #countdown-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.88);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    z-index:5;
  }
  #countdown-overlay .cd-label{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#9a9d9c;
  }
  #countdown-overlay .cd-number{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:min(18vw, 140px);
    color:#adc6ff;
    line-height:1;
  }
  #countdown-overlay .cd-next{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:min(4vw, 28px);
    color:#e5e2e1;
    text-align:center;
    padding:0 20px;
  }
  #cd-singer-highlight{
    background:rgba(255,255,255,0.06);
    border:1px solid #4d8eff;
    border-radius:16px;
    padding:20px 32px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    margin:8px 0;
  }
  .cd-singer-position{
    font-family:'JetBrains Mono',monospace;
    font-size:min(2vw,13px);
    color:#4edea3;
    letter-spacing:0.1em;
  }
  #cd-singer-name-display{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:min(5vw,32px);
    color:#e5e2e1;
  }
  #cd-singer-song-display{
    font-size:min(3vw,18px);
    color:#adc6ff;
  }
  #cd-upcoming-list{ display:flex; flex-direction:column; gap:4px; max-width:60vw; }
  .cd-upcoming-row{
    display:flex; align-items:center; gap:10px;
    font-size:min(2.2vw,14px);
    color:#9a9d9c;
  }
  .cd-upcoming-row .name{ font-weight:600; color:#e5e2e1; }
</style>
</head>
<body>

<div id="canvas-wrap" class="hidden">
  <canvas id="cdg-canvas" width="900" height="648"></canvas>
</div>

<div id="video-wrap" class="hidden">
  <video id="video-el" muted playsinline></video>
</div>

<div id="idle-overlay">
  <img id="idle-logo" src="assets/logo.svg" alt=""/>
  <div id="idle-custom-image" class="hidden"></div>
</div>

<div id="countdown-overlay" class="hidden">
  <div id="countdown-timer-parts">
    <span class="cd-label">Próxima música em</span>
    <span class="cd-number" id="cd-number">10</span>
    <span class="cd-next" id="cd-next-title"></span>
  </div>

  <div id="cd-singer-highlight" class="hidden">
    <span class="cd-singer-position" id="cd-singer-position">#1 · CANTOR DA VEZ</span>
    <div id="cd-singer-name-display">—</div>
    <div id="cd-singer-song-display">—</div>
  </div>
  <div id="cd-upcoming-list"></div>
</div>

<button id="fs-btn" title="Tela cheia">
  <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/></svg>
</button>

<script src="js/cdg-player.js"></script>
<script src="js/second-screen.js"></script>
</body>
</html>
